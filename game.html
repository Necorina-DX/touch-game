<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simple Touch Game</title>

<style>
body {margin: 0;overflow: hidden;background: #eeeeee;touch-action: none;}

#character {position: absolute;width: 80px;height: 80px;background: orange;border-radius: 50%;left: 100px;top: 200px;}
</style>
</head>

<body>

<div id="character"></div>

<script>
const character = document.getElementById("character");

let dragging = false;

character.addEventListener("pointerdown", function(e) {dragging = true;character.setPointerCapture(e.pointerId);});

character.addEventListener("pointermove", function(e) {if (!dragging) return;const x = e.clientX - character.offsetWidth / 2;const y = e.clientY - character.offsetHeight / 2;character.style.left = x + "px";character.style.top = y + "px";});

character.addEventListener("pointerup", function() {dragging = false;});
</script>

</body>
</html>
